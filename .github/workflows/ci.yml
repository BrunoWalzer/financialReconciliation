name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Uma execucao por referencia: push em cima de PR aberto nao roda duas vezes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew :backend:compileJava :backend:compileTestJava

      # Antes dos testes, e deliberado: com a fronteira quebrada, o resto e ruido.
      - name: Regras arquiteturais (ArchUnit)
        run: ./gradlew :backend:architectureTest

      - name: Testes unitarios
        run: ./gradlew :backend:test

      - name: Testes de integracao (Testcontainers)
        run: ./gradlew :backend:integrationTest

      - name: Build
        run: ./gradlew :backend:build -x test -x architectureTest -x integrationTest

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: backend/build/reports/tests/
          retention-days: 7
