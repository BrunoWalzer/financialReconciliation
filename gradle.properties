# A JVM que o Gradle forka para compilar e para testar recebe o classpath num argfile,
# e o launcher le esse arquivo com a codificacao NATIVA do sistema, nao com file.encoding.
# Quando o caminho do projeto ou do GRADLE_USER_HOME tem caractere acentuado, as duas
# precisam coincidir — do contrario o worker nao encontra as proprias classes e o build
# falha com ClassNotFoundException em GradleWorkerMain.
#
# COMPAT alinha file.encoding a codificacao nativa em qualquer plataforma: UTF-8 no Linux
# do CI, windows-1252 numa maquina Windows em pt-BR. O encoding do codigo-fonte e dos
# testes continua fixado em UTF-8 no build.gradle.kts, independentemente disto.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=COMPAT

org.gradle.parallel=true
