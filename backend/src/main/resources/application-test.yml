# Perfil de teste automatizado. O DataSource vem do contêiner Testcontainers via
# @ServiceConnection — nenhuma coordenada de banco é fixada aqui.
spring:
  flyway:
    enabled: true
    placeholders:
      # Fixo e obviamente falso: nunca usado fora da suíte automatizada.
      bootstrapAdminPassword: test-only-bootstrap-password
  autoconfigure:
    # A maioria dos testes usa publisher falso (TDS 17.3, "os demais usam publisher
    # falso") — sem isso, toda a suíte tentaria abrir conexão com um broker real em
    # localhost:5672 ao subir o contexto. O único teste com RabbitMQ real
    # (ImportJobRabbitMqIntegrationTest) limpa esta exclusão via @SpringBootTest(properties=...).
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

fincore:
  jwt:
    # Fixo para determinismo: os testes assinam e verificam com o mesmo segredo em toda
    # a suíte. Nunca reaproveitado fora do perfil test.
    secret: test-only-jwt-signing-secret-key-32-bytes-minimum
  cors:
    allowed-origin: http://localhost:5173
  ingestion:
    # Diretório efêmero, fora do caminho usado pelo perfil local/dev.
    file-storage-path: ./build/test-data/imports

logging:
  level:
    dev.fincore: DEBUG
