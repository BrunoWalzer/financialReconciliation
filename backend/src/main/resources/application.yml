# Configuração operacional do FINCORE (TDS 30.1).
# Regra de negócio parametrizada — tolerância, taxa, janelas — nunca entra aqui:
# ela mora em tabela, é auditada e é capturada no snapshot da execução.
spring:
  application:
    name: fincore
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    # O schema é a especificação de correção: uma migration aplicada nunca é editada.
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    placeholders:
      # V2__identity.sql usa isto para o hash do administrador semeado (TDS 29.4). Nunca
      # tem valor aqui — cada perfil fornece o seu (local com padrão de desenvolvimento,
      # test com um fixo, dev/produção exigem a variável de ambiente sem padrão).
      bootstrapAdminPassword: ${FINCORE_BOOTSTRAP_ADMIN_PASSWORD}
  jpa:
    # O schema é gerado só pelo Flyway; Hibernate apenas confere que o mapeamento bate
    # com o que a migration criou. Nunca `update` nem `create` — o schema não nasce do
    # código (TDS P2).
    hibernate:
      ddl-auto: validate
    # Sem sessão aberta durante a renderização da view: cada acesso a dado preguiçoso
    # fora da transação vira uma falha em teste, não um round-trip escondido em produção.
    open-in-view: false
  mvc:
    # O formato de erro é produzido pelo GlobalErrorHandler, não pelo padrão do Spring.
    problemdetails:
      enabled: false
  web:
    resources:
      # Sem recursos estáticos: rota desconhecida vira 404 RFC 9457, não uma busca em disco.
      add-mappings: false
  servlet:
    multipart:
      # Mesmo limite de negócio de fincore.ingestion.max-upload-bytes (TDS 9.1) — o
      # resolvedor de multipart do Spring rejeita antes de o corpo ser materializado.
      max-file-size: ${FINCORE_MAX_UPLOAD_BYTES:52428800}
      max-request-size: ${FINCORE_MAX_UPLOAD_BYTES:52428800}

server:
  port: ${FINCORE_SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Liveness e readiness separados (TDS 26).
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  fincore:
    # Versão do conjunto de regras de matching (TDS 30.2). Fica em código, não em banco.
    ruleSetVersion: ${FINCORE_RULE_SET_VERSION:1}

fincore:
  jwt:
    # Sem padrão: um segredo previsível em produção anula a assinatura (TDS 27).
    secret: ${FINCORE_JWT_SECRET}
    access-ttl: ${FINCORE_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${FINCORE_JWT_REFRESH_TTL:7d}
  cors:
    # Origem única, sem padrão: nunca "*" (TDS 21.3).
    allowed-origin: ${FINCORE_CORS_ORIGIN}
  ingestion:
    # Limites aprovados (Implementation Plan FD-10 OD-5): 50 MB, 500 mil linhas, lote de
    # 1000 linhas por transação. "Calibrar no M18" não é licença para mudar aqui.
    file-storage-path: ${FINCORE_FILE_STORAGE_PATH:./data/imports}
    max-upload-bytes: ${FINCORE_MAX_UPLOAD_BYTES:52428800}
    max-upload-lines: ${FINCORE_MAX_UPLOAD_LINES:500000}
    batch-size: 1000

logging:
  # Log estruturado em JSON com o MDC — correlationId, e mais adiante userId e module.
  structured:
    format:
      console: ecs
